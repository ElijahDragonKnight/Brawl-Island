<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Brawl Island</title>
    
    <!-- Favicon Code Added Below -->
    <link rel="icon" type="image/jpeg" href="fist.jpg">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <style>
        :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        *{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
        html,body{height:100%}body{margin:0;overflow:hidden;background:#14105a;color:#fff;font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
        button{font:inherit;cursor:pointer;border:0;color:#fff;background:#4a5ae8;font-weight:800;padding:9px 14px;border-radius:10px}
        button.alt{background:rgba(255,255,255,.18)}button:disabled{opacity:.45;cursor:not-allowed}
        input{padding:10px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:inherit;width:100%}
        input::placeholder{color:#b8c4ee}
        #stage{position:fixed;inset:0;z-index:1;overflow:hidden;background:#3b3fd0}
        #cv{width:100%;height:100%;display:block}
        #mm{display:none;position:absolute;right:12px;top:12px;width:150px;height:150px;border-radius:8px;border:2px solid rgba(255,255,255,.7)}
        #ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 italic clamp(22px,4vw,44px) system-ui;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none;text-align:center}
        #hudTL{display:none;position:absolute;left:14px;top:14px;width:min(320px,50vw);color:#fff;text-shadow:0 1px 4px #000;font-weight:700}
        .hb{display:flex;gap:10px;align-items:center;margin-bottom:6px}
        .bar{height:14px;background:rgba(0,0,0,.45);border-radius:7px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#4cc16f;width:100%}
        #leave{display:none;position:absolute;right:12px;top:172px;background:rgba(0,0,0,.55)}
        #hudmsg{display:none;position:absolute;left:0;right:0;bottom:48px;text-align:center;pointer-events:none}
        #hudmsg #msg{display:inline-block;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:20px;max-width:90%}
        #hint{display:none;position:absolute;left:14px;bottom:12px;font-size:12px;color:#fff;text-shadow:0 1px 4px #000}
        body.ingame #mm,body.ingame #hudTL,body.ingame #leave,body.ingame #hudmsg,body.ingame #hint{display:block}
        body.ingame #lobby{display:none}
        kbd{background:rgba(128,128,128,.35);padding:1px 6px;border-radius:4px;font-size:12px}
        #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,30,.38) 100%)}
        /* ---- mobile / touch ---- */
        body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
        input{-webkit-user-select:text;user-select:text}.pn{touch-action:pan-y}
        #leave{z-index:6}
        #touch{display:none;position:absolute;inset:0;z-index:3;pointer-events:none}
        body.ingame.touch #touch{display:block}
        #tzR{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto;touch-action:none}
        #tzL{position:absolute;left:0;bottom:0;width:42%;height:65%;pointer-events:auto;touch-action:none}
        #joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);display:none;pointer-events:none}
        #joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.55)}
        #tbtn{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:row-reverse;flex-wrap:wrap-reverse;gap:10px;width:240px;align-items:flex-end;pointer-events:auto}
        .tb{width:62px;height:62px;border-radius:50%;padding:0;font-size:26px;background:rgba(30,30,100,.55);border:2px solid rgba(255,255,255,.6);touch-action:none;-webkit-tap-highlight-color:transparent}
        .tb.big{width:80px;height:80px;font-size:32px;background:rgba(255,120,30,.75)}.tb.sm{width:50px;height:50px;font-size:20px}
        .tb.on{filter:brightness(1.5)}
        #rot{display:none;position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:8px 14px;border-radius:20px;font-size:13px;z-index:6;animation:fade 6s forwards;pointer-events:none}
        @keyframes fade{70%{opacity:1}100%{opacity:0;visibility:hidden}}
        @media (orientation:portrait) and (pointer:coarse){body.ingame #rot{display:block}}
        @media (pointer:coarse){#hint{display:none!important}#mm{width:110px;height:110px}#leave{top:132px;padding:6px 10px;font-size:13px}#hudTL{width:min(240px,45vw)}}
        @media (max-height:500px){#logo,#news{display:none}.nv{width:62px;height:62px;font-size:11px}.nv i{font-size:22px}#play{font-size:24px;padding:8px}#battle{width:min(300px,45vw);bottom:10px}#navB{bottom:10px}#topL{padding:4px 14px 4px 4px}#avatar{width:38px;height:38px}
         .pn{top:64px;right:14px;width:min(400px,50vw);max-height:calc(100vh - 80px)}#lobby.pnopen #battle{display:none}}
        /* ---- lobby (home screen) ---- */
        #lobby{position:fixed;inset:0;z-index:5;pointer-events:none;--bg:rgba(255,255,255,.1);--ink:#fff;--mut:#bccaf5;--line:rgba(255,255,255,.3);--acc:#ffb81c;--ok:#4cd27a}
        #lobby>*{pointer-events:auto}
        .glass{background:linear-gradient(180deg,rgba(40,34,150,.82),rgba(20,16,90,.88));border:2px solid rgba(150,205,255,.55);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,50,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
        #topL{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:10px;padding:7px 20px 7px 7px;border-radius:40px}
        #avatar{width:50px;height:50px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font:900 22px system-ui;text-shadow:0 1px 3px #0008}
        #pnm{font-weight:900;font-size:18px;font-style:italic}#lvl{font-size:12px;color:#ffe27a;font-weight:700}
        #logo{position:absolute;left:50%;top:12px;transform:translateX(-50%);font:900 italic 30px "Trebuchet MS",system-ui;letter-spacing:2px;color:#fff;-webkit-text-stroke:1.5px #2a1a8a;text-shadow:0 3px 0 #2a1a8a,0 0 18px #7ad7ff}
        #topR{position:absolute;right:16px;top:14px;display:flex;gap:10px}
        .pill{padding:9px 18px;border-radius:30px;font-weight:800}
        #news{position:absolute;left:16px;top:90px;width:240px;display:flex;flex-direction:column;gap:10px}
        .ban{padding:12px 14px;border-radius:12px;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,50,.4);cursor:pointer;transform:skewX(-4deg)}
        .ban b{display:block;font:900 italic 16px system-ui}.ban span{font-size:12px;opacity:.95}
        .b1{background:linear-gradient(120deg,#ff5f8a,#ff9a3c)}.b2{background:linear-gradient(120deg,#2fc7ff,#6a5cff)}
        #navB{position:absolute;left:16px;bottom:16px;display:flex;gap:10px}
        .nv{width:88px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-style:italic;border-radius:16px}
        .nv i{font-style:normal;font-size:30px}.nv:hover{filter:brightness(1.25)}
        #battle{position:absolute;right:20px;bottom:18px;width:min(380px,calc(100vw - 40px));display:flex;flex-direction:column;gap:9px}
        #modeChip{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-radius:12px;background:rgba(20,16,90,.88);border:2px solid rgba(150,205,255,.6);font-style:italic}
        #modeChip span{font-size:11px;color:#ffe27a;letter-spacing:1px}
        #play{font:900 italic 36px "Trebuchet MS",system-ui;letter-spacing:3px;padding:14px;border-radius:14px;background:linear-gradient(180deg,#ffe86a,#ff9a1a);color:#4a2400;border:3px solid #fff;box-shadow:0 0 0 3px #ff9a1a,0 8px 26px rgba(255,150,0,.55);transform:skewX(-6deg);animation:pulse 1.8s infinite}
        #play:hover{filter:brightness(1.1);transform:skewX(-6deg) scale(1.03)}
        @keyframes pulse{50%{box-shadow:0 0 0 3px #ff9a1a,0 8px 36px rgba(255,200,40,.95)}}
        #battle #msg{background:rgba(20,16,90,.88);border:2px solid rgba(150,205,255,.5);padding:8px 14px;border-radius:12px;font-size:13px}#msg:empty{display:none}
        .pn{display:none;position:absolute;right:20px;top:76px;width:min(440px,calc(100vw - 40px));max-height:calc(100vh - 290px);overflow:auto;padding:14px}
        .pn.open{display:block}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:900 italic 18px}
    </style>
</head>
<body>
    <!-- Your main game panels, canvas, and elements sit here -->
</body>
</html>
