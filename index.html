<!DOCTYPE html><html><head><meta charset="utf-8"><title>Brawl Island</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #0a082c; color: #fff; font: 13px/1.3 sans-serif; }
button { font: inherit; cursor: pointer; border: 0; color: #fff; background: #4a5ae8; font-weight: 800; padding: 8px 14px; border-radius: 8px; }
#stage { position: fixed; inset: 0; z-index: 1; overflow: hidden; }
#cv { width: 100%; height: 100%; display: block; background: #252893; }
#hudTL { position: absolute; left: 15px; top: 15px; width: 250px; z-index: 10; text-shadow: 0 1px 3px #000; }
.hb { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.bar { height: 14px; background: rgba(0,0,0,0.5); border-radius: 7px; overflow: hidden; flex: 1; border: 1px solid rgba(255,255,255,0.2); }
.bar i { display: block; height: 100%; background: #4cc16f; width: 100%; }
.ox-bar i { background: #3498db; } .fuel-bar i { background: #f1c40f; }
#storm-warning { display: none; position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); background: rgba(192,41,43,0.95); border: 2px solid #ff4d4d; padding: 12px 24px; border-radius: 10px; text-align: center; z-index: 10; }
#round-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
#unite-lobby { position: fixed; inset: 0; z-index: 20; background: linear-gradient(135deg, #101438, #1a226b); display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
#unite-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffb81c; padding-bottom: 8px; margin-bottom: 12px; }
#unite-main { display: flex; flex: 1; gap: 15px; flex-wrap: wrap; }
#unite-spotlight { flex: 1; min-width: 240px; background: radial-gradient(circle, #2b3595, #151a4e); border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; padding: 12px; justify-content: space-between; }
#spotlight-canvas { width: 130px; height: 130px; background: rgba(255,255,255,0.03); border-radius: 50%; margin: 10px auto; display: block; }
#fighter-bio { background: rgba(0,0,0,0.4); padding: 8px; border-radius: 6px; border-left: 3px solid #ffb81c; }
#unite-dashboard { flex: 1.4; min-width: 260px; display: flex; flex-direction: column; gap: 12px; }
.dash-section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; }
.dash-section h4 { margin: 0 0 8px 0; color: #ffe27a; text-transform: uppercase; font-size: 12px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
.pick-card { background: rgba(20,16,90,0.7); border: 2px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; }
.pick-card.active { border-color: #ffb81c; background: #3b3fd0; }
.move-card { background: rgba(10,8,44,0.6); border: 2px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 4px; }
.move-card.selected { border-color: #4cd27a; background: rgba(76,210,122,0.15); }
.move-badge { background: #ffb81c; color: #000; font-weight: 900; font-size: 9px; padding: 1px 3px; border-radius: 2px; }
#action-bar { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
#play-btn { background: linear-gradient(135deg, #ff9f43, #ff5252); font-size: 18px; padding: 8px 30px; border-radius: 20px; font-weight: 900; }
#touch-overlay { display: none; position: absolute; inset: 0; z-index: 50; pointer-events: none; }
body.touch-enabled #touch-overlay { display: block; }
.touch-zone { position: absolute; pointer-events: auto; }
#zone-joystick { left: 0; bottom: 0; width: 45%; height: 60%; }
#zone-actions { right: 0; bottom: 0; width: 50%; height: 60%; display: flex; flex-direction: row-reverse; flex-wrap: wrap-reverse; gap: 10px; padding: 15px; justify-content: flex-start; align-items: flex-end; }
#virtual-joy { position: absolute; width: 90px; height: 90px; border: 3px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); border-radius: 50%; display: none; transform: translate(-50%, -50%); }
#virtual-joy-stick { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; background: rgba(255,255,255,0.6); border-radius: 50%; }
.v-btn { width: 50px; height: 50px; border-radius: 50%; background: rgba(20,20,70,0.8); border: 1px solid rgba(255,255,255,0.5); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.v-btn.main-attack { width: 70px; height: 70px; font-size: 22px; background: rgba(230,126,34,0.9); }
#hudmsg { position: absolute; left: 50%; bottom: 25px; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 6px 16px; border-radius: 15px; font-weight: bold; z-index: 10; pointer-events: none; display: none; border: 1px solid rgba(255,255,255,0.2); }
#leave-btn { position: absolute; right: 15px; top: 15px; z-index: 10; background: rgba(0,0,0,0.6); display: none; }
</style></head><body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hudTL">
  <div class="hb"><div>HP</div><div class="bar"><i id="hp-fill"></i></div></div>
  <div class="hb" id="hud-oxygen" style="display:none;"><div style="color:#3498db;">O2</div><div class="bar ox-bar"><i id="ox-fill"></i></div></div>
  <div class="hb" id="hud-fuel" style="display:none;"><div style="color:#f1c40f;">GAS</div><div class="bar fuel-bar"><i id="fuel-fill"></i></div></div>
  <div style="margin-top: 4px; font-size: 11px; background: rgba(0,0,0,0.5); padding: 4px; border-radius: 4px;">
    Wep: <span id="hud-weapon" style="color:#ffb81c;">Fists</span> | Moves: <span id="hud-moves" style="color:#4cd27a;">None</span>
  </div>
</div>
<div id="storm-warning"><h2 style="margin:0; font-size:20px;">OUTSIDE STORM!</h2><p style="margin:2px 0 0 0; font-size:13px;">Dying in <span id="storm-timer">5</span>s</p></div>
<button id="leave-btn" onclick="exitToLobby()">Leave Arena</button>
<div id="hudmsg"></div>
<div id="touch-overlay">
  <div id="zone-joystick" class="touch-zone"></div>
  <div id="zone-actions" class="touch-zone">
    <div class="v-btn main-attack" id="v-atk">⚔️</div><div class="v-btn" id="v-m1">M1</div><div class="v-btn" id="v-m2">M2</div><div class="v-btn" id="v-action">🚗</div>
  </div>
  <div id="virtual-joy"><div id="virtual-joy-stick"></div></div>
</div>
<div id="round-overlay"><div id="round-title">ROUND OVER</div><button onclick="exitToLobby()" style="margin-top:15px;">Back to Menu</button></div>
<div id="unite-lobby">
  <div id="unite-header"><div>BRAWL ISLAND <span style="color:#ffb81c;">UNITE TRAINER</span></div><div>ELITE CRUSADER</div></div>
  <div id="unite-main">
    <div id="unite-spotlight"><canvas id="spotlight-canvas" width="160" height="160"></canvas><div id="fighter-bio"><h3 id="bio-title" style="margin:0; color:#ffb81c;">Cinder Knight</h3><p id="bio-desc" style="margin:2px 0 0 0; font-size:11px; color:#d0d7ff;"></p></div></div>
    <div id="unite-dashboard">
      <div class="dash-section"><h4>Select Fighter Class</h4><div class="pick-grid" id="fighter-grid"></div></div>
      <div class="dash-section"><h4>Equip 2 Best Moves</h4><div id="moves-container"></div></div>
    </div>
  </div>
  <div id="action-bar"><div style="margin-right:auto; opacity:0.7; font-size:11px;">WASD: Move | Space: Attack | Q, E: Skills | F: Car</div><button id="play-btn" onclick="startSingleRoundMatch()">LAUNCH MATCH</button></div>
</div>
<script>
const FIGHTERS = {
  knight: { name: 'Cinder Knight', icon: '⚔️', baseColor: '#e74c3c', secondaryColor: '#f39c12', speed: 4.2, desc: 'Fierce close combat master.' },
  ninja:  { name: 'Shadow Shinobi', icon: '🥷', baseColor: '#8e44ad', secondaryColor: '#2c3e50', speed: 5.4, desc: 'High velocity ambush ninja.' },
  cyborg: { name: 'Cyber Mech', icon: '🤖', baseColor: '#2ecc71', secondaryColor: '#27ae60', speed: 3.5, desc: 'Heavy armor machine build.' },
  mage:   { name: 'Void Chrono', icon: '🧙', baseColor: '#3498db', secondaryColor: '#9b59b6', speed: 4.4, desc: 'Long range projectile spellcaster.' }
};
const MOVES_POOL = [
  { id: 'dash', name: 'Quantum Burst', badge: 'Dash', desc: 'Instantly teleports forward.' },
  { id: 'slash', name: 'Sonic Wave', badge: 'AoE', desc: 'Fires a crescent slash projectile.' },
  { id: 'heal', name: 'Nano Matrix', badge: 'Heal', desc: 'Repairs body units to gain +35 HP.' },
  { id: 'shield', name: 'Aegis Wall', badge: 'Block', desc: 'Generates surrounding shield circle.' }
];
let chosenFighter = 'knight', chosenMoves = ['dash', 'slash'], canvas, ctx, loopId = null;
const MAP_W = 2400, MAP_H = 2400;
let structures = [], items = [], vehicles = [], fxList = [], player, enemies = [], matchActive = false, roundEnded = false;
let stormCircle = { x: 1200, y: 1200, radius: 1100, targetRadius: 260 }, stormTimerState = false, outOfStormCounter = 0, globalTick = 0, keys = {}, touchJoy = { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0 };
window.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('cv'); ctx = canvas.getContext('2d');
  setupLobbyUI(); buildStaticWorldMap(); setupInputListeners(); renderLobbySpotlight();
  window.addEventListener('resize', autoResizeCanvas); autoResizeCanvas();
});
function autoResizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function setupLobbyUI() {
  const fGrid = document.getElementById('fighter-grid'); fGrid.innerHTML = '';
  Object.keys(FIGHTERS).forEach(key => {
